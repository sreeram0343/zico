services:
  postgres:
    image: postgres:16-alpine
    container_name: zico_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-zico}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-user} -d $${POSTGRES_DB:-zico}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zico-net

  redis:
    image: redis:7-alpine
    container_name: zico_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - zico-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: zico_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zico-net

volumes:
  postgres_data:
    name: zico_postgres_data
  redis_data:
    name: zico_redis_data
  qdrant_data:
    name: zico_qdrant_data

networks:
  zico-net:
    name: zico-network
    driver: bridge